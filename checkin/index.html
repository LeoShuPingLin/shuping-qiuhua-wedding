<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4f5" />
  <title>書平 & 秋華｜婚宴報到</title>
  <link rel="stylesheet" href="ux-v4.css?v=20261007-5" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../seating/config.js"></script>
  <script defer src="app-v4.js?v=20261007-5"></script>
  <script defer src="ux-fix-v4.js?v=20261007-5"></script>
</head>
<body>
  <section class="auth-shell" id="authShell">
    <div class="auth-card">
      <div class="eyebrow">WEDDING CHECK-IN</div>
      <h1>書平 & 秋華</h1>
      <p class="auth-copy">婚宴報到・帶位回報</p>
      <form id="loginForm" class="login-form">
        <label>工作人員密碼
          <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="請輸入工作人員密碼" />
        </label>
        <button class="btn primary wide" id="loginBtn" type="submit">進入報到系統</button>
      </form>
      <div class="auth-msg" id="authMsg"></div>
      <p class="privacy-note">婚禮工作人員專用。輸入密碼即可，不需要 Email。</p>
    </div>
  </section>

  <main class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar-main">
        <h1>婚宴報到</h1>
        <p>搜尋來賓，確認桌次與到場人數</p>
      </div>
      <div class="topbar-actions">
        <span class="live-status" id="liveStatus" data-tone="ok">即時同步</span>
        <button class="logout-btn" id="logoutBtn" type="button">登出</button>
      </div>
    </header>

    <section class="search-zone" aria-label="搜尋來賓">
      <div class="search-combobox">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="guestSearch"
            type="search"
            role="combobox"
            aria-label="搜尋來賓"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="searchSuggestions"
            autocomplete="off"
            autocapitalize="off"
            enterkeyhint="search"
            placeholder="輸入姓名，例如：何"
          />
          <button class="clear-search" id="clearSearch" type="button" aria-label="清除搜尋" hidden>×</button>
        </div>
        <div class="search-suggestions" id="searchSuggestions" role="listbox" hidden></div>
      </div>
    </section>

    <section class="stats" id="stats" aria-label="報到統計"></section>

    <div class="section-title">
      <h2>最近報到</h2>
      <span>點一下可修正</span>
    </div>
    <section class="recent-list" id="recentList"></section>
    <div class="recent-empty" id="recentEmpty">目前還沒有報到紀錄</div>

    <div class="tip-card">
      <b>最快用法：</b>輸入姓名的一個字 → 點選來賓 → 確認桌次 → 按「全部到齊」。
    </div>

    <div class="toast" id="toast"></div>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="guest-sheet" id="guestSheet" aria-label="來賓報到" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="sheet-close" id="sheetClose" type="button" aria-label="關閉">×</button>
    <div class="sheet-content" id="sheetContent"></div>
  </section>
</body>
</html>
