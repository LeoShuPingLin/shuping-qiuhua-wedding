<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7eef1" />
  <title>書平 & 秋華｜婚宴報到</title>
  <link rel="stylesheet" href="style.css?v=20261007-1" />
  <link rel="stylesheet" href="mobile.css?v=20261007-2" />
  <link rel="stylesheet" href="mobile-v2.css?v=20261007-4" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../seating/config.js"></script>
  <script defer src="app-v3.js?v=20261007-4"></script>
</head>
<body>
  <section class="auth-shell" id="authShell">
    <div class="auth-card">
      <div class="eyebrow">WEDDING CHECK-IN</div>
      <h1>書平 & 秋華</h1>
      <p class="auth-copy">婚宴報到・帶位回報</p>
      <form id="loginForm" class="login-form">
        <label>工作人員密碼<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="請輸入工作人員密碼" /></label>
        <button class="btn primary wide" id="loginBtn" type="submit">進入報到系統</button>
      </form>
      <div class="auth-msg" id="authMsg"></div>
      <p class="privacy-note">婚禮工作人員專用。輸入密碼即可進入，不需要 Email。</p>
    </div>
  </section>

  <main class="app" id="app" hidden>
    <header class="hero">
      <div>
        <div class="eyebrow">WEDDING CHECK-IN · LIVE</div>
        <h1>婚宴報到</h1>
        <p>搜尋名字 → 確認桌次 → 回報到場人數</p>
      </div>
      <div class="hero-side">
        <span id="saveStatus">已同步</span>
        <button class="btn" id="logoutBtn" type="button">登出</button>
      </div>
    </header>

    <section class="controls" aria-label="搜尋與篩選">
      <div class="search">
        <span class="search-mark">⌕</span>
        <input id="searchInput" placeholder="輸入姓名其中一個字，例如：何" autocomplete="off" autocapitalize="off" enterkeyhint="search" />
      </div>
      <div class="search-foot">
        <span id="searchCount">共 0 組</span>
        <span class="search-tip">打一個字就會立即篩選</span>
      </div>
      <select id="tableFilter" aria-label="桌次篩選"><option value="all">全部桌次</option></select>
      <label class="toggle"><input id="pendingOnly" type="checkbox" /> 只看未全到</label>
      <button class="btn" id="clearFilterBtn" type="button">清除</button>
    </section>

    <section class="table-chips" id="tableChips"></section>
    <section class="stats" id="stats"></section>
    <section class="guest-list" id="guestList"></section>

    <div class="toast" id="toast"></div>
  </main>
</body>
</html>
