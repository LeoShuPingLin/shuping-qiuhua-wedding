<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7eef1" />
  <title>書平 & 秋華｜婚宴報到</title>
  <link rel="stylesheet" href="style.css?v=20261007-1" />
  <link rel="stylesheet" href="mobile.css?v=20261007-2" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../seating/config.js"></script>
  <script defer src="app-v2.js?v=20261007-3"></script>
</head>
<body>
  <section class="auth-shell" id="authShell">
    <div class="auth-card">
      <div class="eyebrow">WEDDING CHECK-IN</div>
      <h1>書平 & 秋華</h1>
      <p class="auth-copy">婚宴報到・帶位回報</p>
      <form id="loginForm" class="login-form">
        <label>工作人員密碼<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="請輸入工作人員密碼" /></label>
        <button class="btn primary wide" id="loginBtn" type="submit">進入報到系統</button>
      </form>
      <div class="auth-msg" id="authMsg"></div>
      <p class="privacy-note">婚禮工作人員專用。只要輸入密碼即可，不需要 Email。</p>
    </div>
  </section>

  <main class="app" id="app" hidden>
    <header class="hero">
      <div>
        <div class="eyebrow">WEDDING CHECK-IN · LIVE</div>
        <h1>婚宴報到</h1>
        <p>搜尋來賓 → 確認桌次 → 回報到場人數</p>
      </div>
      <div class="account-box">
        <div><b id="accountEmail">帶位人員</b><span id="accountRole">工作人員</span></div>
        <button class="btn" id="logoutBtn" type="button">登出</button>
      </div>
    </header>

    <section class="reporter-bar">
      <label>我是誰？<input id="reporterName" placeholder="請填你的名字，例如：阿豪" maxlength="30" /></label>
      <span id="saveStatus">● 已連線</span>
    </section>

    <section class="quick-help">
      <b>當天怎麼用？</b>
      <span>找到來賓後，全部到齊就按「全到」；如果只到部分人，用 ＋／－ 調整即可。</span>
    </section>

    <section class="stats" id="stats"></section>

    <section class="controls">
      <div class="search">⌕ <input id="searchInput" placeholder="搜尋姓名、同行者或桌名" autocomplete="off" /></div>
      <select id="tableFilter"><option value="all">全部桌次</option></select>
      <label class="toggle"><input id="pendingOnly" type="checkbox" /> 只看未全到</label>
      <button class="btn" id="clearFilterBtn" type="button">清除搜尋／篩選</button>
    </section>

    <section class="table-chips" id="tableChips"></section>
    <section class="guest-list" id="guestList"></section>

    <div class="toast" id="toast"></div>
  </main>
</body>
</html>
