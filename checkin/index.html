<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4f5" />
  <title>書平 & 秋華｜婚宴帶位查位</title>
  <link rel="stylesheet" href="lookup-v6.css?v=20261008-2" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../seating/config.js"></script>
  <script defer src="lookup-v6.js?v=20261008-2"></script>
</head>
<body>
  <section class="auth-shell" id="authShell">
    <div class="auth-card">
      <div class="eyebrow">WEDDING USHER</div>
      <h1>書平 & 秋華</h1>
      <p class="auth-copy">婚宴帶位・座位查詢</p>
      <form id="loginForm" class="login-form">
        <label>工作人員密碼
          <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="請輸入工作人員密碼" />
        </label>
        <button class="btn primary wide" id="loginBtn" type="submit">進入帶位系統</button>
      </form>
      <div class="auth-msg" id="authMsg"></div>
      <p class="privacy-note">婚禮工作人員專用。輸入密碼後即可搜尋來賓與桌次。</p>
    </div>
  </section>

  <main class="app" id="app" hidden>
    <header class="topbar">
      <div>
        <h1>婚宴帶位</h1>
        <p>輸入姓名，立即找到桌次與位置</p>
      </div>
      <div class="topbar-actions">
        <span class="live-status" id="liveStatus" data-tone="ok">座位已同步</span>
        <button class="logout-btn" id="logoutBtn" type="button">登出</button>
      </div>
    </header>

    <section class="search-zone" aria-label="搜尋來賓">
      <div class="search-combobox">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="guestSearch" type="search" role="combobox" aria-label="搜尋來賓" aria-autocomplete="list" aria-expanded="false" aria-controls="searchSuggestions" autocomplete="off" autocapitalize="off" enterkeyhint="search" placeholder="輸入姓名，例如：何" />
          <button class="clear-search" id="clearSearch" type="button" aria-label="清除搜尋" hidden>×</button>
        </div>
        <div class="search-suggestions" id="searchSuggestions" role="listbox" hidden></div>
      </div>
    </section>

    <section class="lookup-result" id="guestResult" hidden>
      <div class="result-kicker">已找到來賓</div>
      <div class="result-name" id="resultName">—</div>
      <div class="result-destination">
        <span>請帶位至</span>
        <b id="resultTable">—</b>
      </div>
      <div class="result-meta" id="resultMeta"></div>
      <div class="result-actions"><button class="btn" id="searchAgain" type="button">搜尋下一位</button></div>
    </section>

    <section class="map-card">
      <div class="map-head">
        <h2>國際宴會 A 廳</h2>
        <span id="mapCaption">選到來賓後，對應桌次會在圖上亮起來</span>
      </div>
      <div class="venue-map" id="venueMap" aria-label="婚宴座位圖">
        <div class="venue-label venue-audio">音控室</div>
        <div class="venue-label venue-stage">舞台</div>
        <div class="venue-label venue-backdrop">背板佈置區</div>
        <div id="mapTables"></div>
      </div>
      <div class="map-legend"><span class="legend-dot"></span>亮起的桌次就是帶位位置</div>
    </section>

    <div class="toast" id="toast"></div>
  </main>
</body>
</html>
