  <style>
    :root { --ink:#44342e; --muted:#76655d; --accent:#a76a70; --accent-dark:#784a4f; --paper:#fffaf4; --line:rgba(91,67,56,.15); --shadow:0 18px 55px rgba(78,55,44,.11); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 8% 3%,rgba(229,196,181,.3),transparent 26rem),linear-gradient(180deg,#fdf9f4,#f5ece2); font-family:"Noto Sans TC",system-ui,sans-serif; line-height:1.75; }
    a { color:inherit; text-decoration:none; }
    button { color:inherit; font:inherit; }
    [hidden] { display:none !important; }
    .topbar { position:relative; min-height:58px; padding:10px max(18px,env(safe-area-inset-left)); display:flex; align-items:center; justify-content:space-between; background:rgba(255,250,244,.9); border-bottom:1px solid var(--line); backdrop-filter:blur(16px); }
    .brand { font-family:"Noto Serif TC",serif; font-weight:700; letter-spacing:.08em; }
    .brand span { color:var(--accent); }
    .back-link { color:var(--muted); font-size:.85rem; font-weight:600; }
    .hero { width:min(920px,calc(100% - 36px)); margin:0 auto; padding:clamp(54px,9vw,92px) 0 34px; text-align:center; }
    .script { margin:0 0 4px; color:var(--accent); font:italic 600 clamp(2.3rem,7vw,4.2rem)/1 "Cormorant Garamond",serif; }
    h1,h2,h3 { font-family:"Noto Serif TC",serif; }
    h1 { margin:10px 0 14px; font-size:clamp(2.15rem,7vw,4rem); letter-spacing:.08em; }
    .hero-note { margin:0 auto; max-width:600px; color:var(--muted); }
    body.venue-selected .hero { padding:14px 0 0; text-align:left; }
    body.venue-selected .hero .script, body.venue-selected .hero .hero-note { display:none; }
    body.venue-selected .hero h1 { margin:0; font:600 1rem/1.5 "Noto Sans TC",sans-serif; color:var(--muted); letter-spacing:.04em; }
    main { width:min(920px,calc(100% - 36px)); margin:0 auto 80px; }
    .step-label { margin:0 0 12px; color:var(--accent-dark); font-size:.78rem; font-weight:700; letter-spacing:.16em; }
    .venue-buttons { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
    .venue-button { min-height:156px; padding:24px; border:1px solid rgba(103,76,64,.16); border-radius:24px; background:rgba(255,250,244,.94); box-shadow:var(--shadow); cursor:pointer; text-align:left; transition:transform .2s ease,border-color .2s ease,background .2s ease; }
    .venue-button:hover { transform:translateY(-3px); }
    .venue-button[aria-pressed="true"] { color:#fff; background:#8e6654; border-color:#8e6654; }
    .venue-button small { display:block; margin-bottom:8px; color:var(--accent); font-size:.75rem; font-weight:700; letter-spacing:.15em; }
    .venue-button[aria-pressed="true"] small { color:#f4d6c4; }
    .venue-button strong { display:block; font-family:"Noto Serif TC",serif; font-size:clamp(1.45rem,4vw,2rem); }
    .venue-button span { display:block; margin-top:6px; font-size:.9rem; opacity:.82; }
    .transport-panel { margin-top:28px; padding:clamp(22px,4vw,38px); background:rgba(255,250,244,.94); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow); }
    .venue-summary { display:flex; justify-content:space-between; gap:20px; align-items:end; padding-bottom:22px; border-bottom:1px solid var(--line); }
    .venue-summary .kicker { margin:0 0 4px; color:var(--accent); font-size:.72rem; font-weight:700; letter-spacing:.18em; }
    .venue-summary h2 { margin:0; font-size:clamp(1.55rem,5vw,2.35rem); }
    .venue-summary p { margin:4px 0 0; color:var(--muted); }
    .address { max-width:340px; text-align:right; font-size:.92rem; }
    .mode-buttons { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:22px 0 0; }
    .mode-button { min-height:58px; padding:10px 18px; border:1px solid var(--accent); border-radius:16px; background:transparent; color:var(--accent-dark); cursor:pointer; font-weight:700; }
    .mode-button[aria-pressed="true"] { color:#fff; background:var(--accent-dark); }
    .mode-content { padding-top:26px; }
    .content-heading { margin:0 0 14px; font-size:1.35rem; }
    .empty-prompt { margin:24px 0 0; color:var(--muted); text-align:center; }
    .info-list { margin:0; }
    .info-row { display:grid; grid-template-columns:42px 1fr; gap:12px; padding:16px 0; border-top:1px solid var(--line); }
    .info-row:first-child { border-top:0; padding-top:0; }
    .info-row dt { font-size:1.2rem; text-align:center; }
    .info-row dd { margin:0; color:var(--muted); }
    .info-row strong { display:block; color:var(--ink); }
    .primary-button,.outline-button { min-height:46px; padding:9px 20px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--accent); border-radius:999px; font-weight:700; }
    .primary-button { margin-top:18px; color:#fff; background:var(--accent-dark); border-color:var(--accent-dark); }
    #venue-nav { width:100%; min-height:58px; font-size:1.05rem; }
    .change-venue { width:100%; margin-top:28px; padding:12px 18px; color:var(--muted); background:transparent; border:0; text-decoration:underline; text-underline-offset:5px; cursor:pointer; }
    .parking-heading { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:14px; }
    .parking-heading h3 { margin:0; font-size:1.35rem; }
    .parking-heading p { margin:2px 0 0; color:var(--muted); font-size:.82rem; }
    .refresh-button { flex:0 0 auto; padding:7px 13px; color:var(--accent-dark); background:transparent; border:1px solid var(--accent); border-radius:999px; cursor:pointer; font-weight:700; }
    .parking-list { display:grid; gap:12px; }
    .parking-card { padding:18px 20px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px 18px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:16px; }
    .parking-card h3 { margin:0 0 2px; font-size:1.08rem; }
    .parking-meta,.parking-note { margin:0; color:var(--muted); font-size:.86rem; }
    .parking-note { margin-top:4px; }
    .parking-actions { display:flex; align-items:center; gap:8px; }
    .parking-actions .outline-button { min-height:38px; padding:6px 13px; font-size:.82rem; }
    .availability { min-width:94px; padding:7px 10px; display:inline-flex; justify-content:center; align-items:baseline; gap:3px; border-radius:999px; color:#645b56; background:#eee8e2; font-size:.75rem; font-weight:700; white-space:nowrap; }
    .availability strong { font-size:1.05rem; }
    .availability.good { color:#2f6d50; background:#e2f1e8; }
    .availability.busy { color:#8a5b13; background:#f7ebcc; }
    .availability.full { color:#923f42; background:#f5dddd; }
    .availability.error { color:#6d635d; background:#ece7e2; }
    .availability.reference { color:#6d635d; background:#eee8e2; }
    .more-parking { margin-top:16px; border-top:1px solid var(--line); }
    .parking-heading-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; }
    .secondary-button { background:#fffaf4; }
    .more-parking summary { display:none; }
    .more-parking summary { padding:16px 4px; color:var(--accent-dark); cursor:pointer; font-weight:700; text-align:center; list-style:none; }
    .more-parking summary::-webkit-details-marker { display:none; }
    .more-parking summary::after { content:' ＋'; }
    .more-parking[open] summary::after { content:' －'; }
    .live-footer { margin-top:12px; display:flex; justify-content:space-between; gap:14px; color:var(--muted); font-size:.76rem; }
    .official-link { color:var(--accent-dark); font-weight:700; }
    .tip { margin-top:20px; padding:16px 18px; background:rgba(231,216,196,.52); border-radius:14px; color:var(--muted); font-size:.88rem; }
    footer { padding:42px 20px calc(44px + env(safe-area-inset-bottom)); color:#fff; text-align:center; background:#846250; }
    footer p { margin:2px; }
    footer .names { font-family:"Noto Serif TC",serif; font-size:1.4rem; letter-spacing:.1em; }
    @media (max-width:650px) { .hero{padding-top:44px}.venue-buttons{grid-template-columns:1fr;gap:12px}.venue-button{min-height:120px;border-radius:19px}.transport-panel{padding:21px 17px;border-radius:19px}.venue-summary{display:block}.address{margin-top:10px;max-width:none;text-align:left}.parking-card{grid-template-columns:1fr}.parking-actions{justify-content:space-between}.live-footer{flex-direction:column;gap:3px} }
    @media (max-width:390px) { main,.hero{width:min(100% - 24px,920px)}.topbar{padding-inline:13px}.back-link{font-size:.78rem}.info-row{grid-template-columns:32px 1fr;gap:8px}.parking-actions{align-items:stretch;flex-direction:column} }
    .transport-panel { margin-top:14px; }
    .venue-summary { display:block; padding-bottom:14px; }
    .venue-summary h2 { font-size:clamp(1.4rem,4.8vw,2rem); line-height:1.5; }
    .address { max-width:none; text-align:left; margin-top:10px; font-size:1rem; overflow-wrap:anywhere; }
    .quick-links { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .quick-links a { display:flex; justify-content:center; align-items:center; min-height:48px; padding:10px 4px; border:1px solid var(--accent); border-radius:12px; color:var(--accent-dark); font-weight:700; font-size:.95rem; }
    a:focus-visible,button:focus-visible { outline:3px solid #66503d; outline-offset:4px; }
    .travel-section { scroll-margin-top:16px; }
    .travel-section + .travel-section { border-top:1px solid var(--line); margin-top:24px; padding-top:24px; }
    .parking-card { grid-template-columns:1fr; padding:16px; }
    .parking-actions { justify-content:space-between; flex-wrap:wrap; }
    .parking-actions .outline-button,.refresh-button { min-height:44px; }
    .parking-meta,.parking-note,.parking-heading p,.tip { font-size:1rem; }
    .availability { white-space:normal; }
    .parking-heading { flex-wrap:wrap; align-items:center; }
    .parking-heading > div { flex:1 1 230px; }
    main { margin-bottom:32px; }
    footer { padding:20px 16px calc(20px + env(safe-area-inset-bottom)); font-size:.85rem; }
    footer .names { font-size:1.05rem; }
    @media (max-width:390px) { .parking-actions{flex-direction:row;align-items:center}.quick-links a{font-size:.88rem} }
    @media (prefers-reduced-motion:reduce) { html{scroll-behavior:auto}*{transition-duration:.01ms!important} }
  </style>

  <section class="hero"><p class="script">Getting There</p><h1>停車・交通資訊</h1><p class="hero-note">先選擇要前往的場地，再查看適合您的交通方式。</p></section>

    <section class="venue-buttons" id="venue-picker" aria-label="選擇婚禮場地">
      <button class="venue-button" type="button" data-venue="tangcheng" aria-pressed="false"><small>佛前結婚儀式</small><strong>湯城園區</strong><span>13:30 入場｜14:00 開始</span></button>
      <button class="venue-button" type="button" data-venue="pengyuan" aria-pressed="false"><small>幸福晚宴</small><strong>彭園三重館</strong><span>17:30 入席｜18:00 開始</span></button>
    </section>
    <section class="transport-panel" id="transport-panel" aria-live="polite" hidden>
      <div class="venue-summary"><div><p class="kicker" id="venue-kicker"></p><h2 id="venue-title"></h2><p id="venue-time"></p></div><div class="address"><p id="venue-address"></p><p id="venue-floor"></p></div></div>
      <a class="primary-button" id="venue-nav" target="_blank" rel="noopener">開啟導航 ↗</a>
      <nav class="quick-links" aria-label="快速查看交通方式"><a href="#drive-info">🚗 開車／停車 ↓</a><a href="#transit-info">🚇 捷運／公車 ↓</a></nav>

      <button class="change-venue" id="change-venue" type="button">查看另一個場地的交通資訊</button>

  <template id="tangcheng-transit"><h3 class="content-heading">大眾運輸</h3><dl class="info-list"><div class="info-row"><dt>🚇</dt><dd><strong>搭乘捷運</strong>先嗇宮站 1 號出口，出站右轉，步行約 5 分鐘抵達湯城園區。</dd></div><div class="info-row"><dt>🚌</dt><dd><strong>搭乘公車</strong>636、801、857 等路線，於「中興街口」站下車。</dd></div></dl></template>
  <template id="pengyuan-transit"><h3 class="content-heading">大眾運輸</h3><dl class="info-list"><div class="info-row"><dt>🚇</dt><dd><strong>搭乘捷運</strong>三重國小站，出站右轉，步行約 3 分鐘抵達介壽廣場。</dd></div><div class="info-row"><dt>🚌</dt><dd><strong>搭乘公車</strong>857、39、62、忠孝幹線等路線，於「龍門路口」或「介壽廣場」站下車。</dd></div></dl></template>
  <template id="tangcheng-drive">
    <div class="parking-heading"><div><h3>🚗 開車前往</h3><p>湯城園區內設有停車場，可直接駛入停車。</p></div></div>
    <aside class="tip">抵達園區後，請依現場指示前往停車區；車位與費率以現場公告為準。</aside>
  </template>
  <template id="pengyuan-drive">
    <div class="parking-heading"><div><h3>推薦停車場</h3><p>光榮、龍門、厚德可查看即時車位；彭園與華南距離近，但車位有限。</p></div><div class="parking-heading-actions"><button class="refresh-button" id="refresh-parking" type="button">更新車位 ↻</button><button class="refresh-button secondary-button" id="toggle-more-parking" type="button" aria-expanded="false">其他停車選項</button></div></div>
    <div class="parking-list">
      <article class="parking-card" data-live-parking="三重區光榮國小地下停車場"><div><h3>① 光榮國小地下停車場</h3><p class="parking-meta">介壽路32號・步行約 8～10 分鐘</p><p class="parking-note">汽車約 30 元／小時・約 575 格車位。</p></div><div class="parking-actions"><span class="availability">查詢中⋯</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%96%B0%E5%8C%97%E5%B8%82%E4%B8%89%E9%87%8D%E5%8D%80%E4%BB%8B%E5%A3%BD%E8%B7%AF32%E8%99%9F">導航到停車場 ↗</a></div></article>
      <article class="parking-card" data-live-parking="龍門公園地下停車場"><div><h3>② 龍門公園地下停車場</h3><p class="parking-meta">公園街32號・步行約 9 分鐘</p><p class="parking-note">20 元／小時・約 427 格車位。</p></div><div class="parking-actions"><span class="availability">查詢中⋯</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E9%BE%8D%E9%96%80%E5%85%AC%E5%9C%92%E5%9C%B0%E4%B8%8B%E5%81%9C%E8%BB%8A%E5%A0%B4">導航到停車場 ↗</a></div></article>
      <article class="parking-card" data-live-parking="三重區厚德國小地下停車場"><div><h3>③ 厚德國小地下停車場</h3><p class="parking-meta">忠孝路一段70號 B1・步行約 10～12 分鐘</p><p class="parking-note">汽車約 30 元／小時・約 95 格車位。</p></div><div class="parking-actions"><span class="availability">查詢中⋯</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%96%B0%E5%8C%97%E5%B8%82%E4%B8%89%E9%87%8D%E5%8D%80%E5%BF%A0%E5%AD%9D%E8%B7%AF%E4%B8%80%E6%AE%B570%E8%99%9F">導航到停車場 ↗</a></div></article>
    </div>
    <details class="more-parking" id="more-parking"><summary>其他停車選項</summary><div class="parking-list">
      <article class="parking-card"><div><h3>彭園特約停車場</h3><p class="parking-meta">正義北路319號旁車道進入・距離最近</p><p class="parking-note">約 80 元／小時；彭園賓客可能享 3 小時免費，請依當日館方公告。車位有限，不建議作為唯一選擇。</p></div><div class="parking-actions"><span class="availability reference">距離近但車位少</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E5%BD%AD%E5%9C%92%E7%89%B9%E7%B4%84%E5%81%9C%E8%BB%8A%E5%A0%B4%E6%AD%A3%E7%BE%A9%E5%8C%97%E8%B7%AF319%E8%99%9F">導航到停車場 ↗</a></div></article>
      <article class="parking-card"><div><h3>華南銀行地下停車場</h3><p class="parking-meta">龍門路1號・彭園對面</p><p class="parking-note">費率與車型限制請依現場公告。</p></div><div class="parking-actions"><span class="availability reference">備選停車場</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%96%B0%E5%8C%97%E5%B8%82%E4%B8%89%E9%87%8D%E5%8D%80%E9%BE%8D%E9%96%80%E8%B7%AF1%E8%99%9F">導航到停車場 ↗</a></div></article>
      <article class="parking-card" data-live-parking="三重區忠孝自強平面停車場"><div><h3>忠孝自強平面停車場</h3><p class="parking-meta">忠孝路二段35號對面・步行約 7～9 分鐘</p><p class="parking-note">汽車約 30 元／小時・約 40 格車位。</p></div><div class="parking-actions"><span class="availability">查詢中⋯</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%96%B0%E5%8C%97%E5%B8%82%E4%B8%89%E9%87%8D%E5%8D%80%E5%BF%A0%E5%AD%9D%E8%B7%AF%E4%BA%8C%E6%AE%B535%E8%99%9F">導航到停車場 ↗</a></div></article>
      <article class="parking-card"><div><h3>三張公園地下停車場</h3><p class="parking-meta">大智街188號・步行約 9 分鐘</p><p class="parking-note">約 30 元／小時。</p></div><div class="parking-actions"><span class="availability reference">備選停車場</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E4%B8%89%E5%BC%B5%E5%85%AC%E5%9C%92%E5%9C%B0%E4%B8%8B%E5%81%9C%E8%BB%8A%E5%A0%B4">導航到停車場 ↗</a></div></article>
    </div></details>

  </template>
  <footer><p class="names">書平 ♡ 秋華</p><p>2026.10.9　我們在婚禮現場等你 🤍</p></footer>
  <script>
    const VENUES={tangcheng:{kicker:'CEREMONY · 佛前結婚儀式',title:'創價學會三重會館',time:'2026.10.9　13:30 入場｜14:00 開始',address:'📍 湯城園區 3樓之1｜新北市三重區重新路五段609巷2號',nav:'https://www.google.com/maps/search/?api=1&query=%E6%96%B0%E5%8C%97%E5%B8%82%E4%B8%89%E9%87%8D%E5%8D%80%E9%87%8D%E6%96%B0%E8%B7%AF%E4%BA%94%E6%AE%B5609%E5%B7%B72%E8%99%9F'},pengyuan:{kicker:'RECEPTION · 幸福晚宴',title:'彭園三重館｜國際宴會 B 廳',time:'2026.10.9　17:30 入席｜18:00 開始',address:'📍 介壽廣場 4樓｜新北市三重區龍門路6號',nav:'https://www.google.com/maps/search/?api=1&query=%E5%BD%AD%E5%9C%92%E4%B8%89%E9%87%8D%E9%A4%A8'}};
    const PARKING_CACHE_API='https://shuping-wedding-parking.a1030788.workers.dev/parking';
    const LIVE_PARKS={'三重區光榮國小地下停車場':'020206','三重區厚德國小地下停車場':'020058','三重區忠孝自強平面停車場':'020072','龍門公園地下停車場':'020016'};
    const panel=document.querySelector('#transport-panel'),content=document.querySelector('#mode-content'),venueStep=document.querySelector('#venue-step'),venuePicker=document.querySelector('#venue-picker'); let selectedVenue='';
    function selectVenue(venueKey,{scroll=true}={}){
      if(!VENUES[venueKey])return;
      selectedVenue=venueKey;
      document.body.classList.add('venue-selected');
      venueStep.hidden=true;venuePicker.hidden=true;
      document.querySelectorAll('[data-venue]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.venue===venueKey)));
      const venue=VENUES[venueKey],tangcheng=venueKey==='tangcheng';
      document.querySelector('#venue-kicker').textContent=tangcheng?'佛前結婚儀式':'幸福晚宴';
      document.querySelector('#venue-title').textContent=tangcheng?'創價學會三重會館':'彭園三重館';
      document.querySelector('#venue-time').textContent=venue.time;
      document.querySelector('#venue-address').textContent=tangcheng?'新北市三重區重新路五段609巷2號':'新北市三重區龍門路6號';
      document.querySelector('#venue-floor').textContent=tangcheng?'湯城園區｜3樓之1':'介壽廣場 4樓｜國際宴會 B 廳';
      const nav=document.querySelector('#venue-nav');
      nav.href=venue.nav;nav.textContent=tangcheng?'導航到會館 ↗':'導航到彭園 ↗';
      content.replaceChildren();
      for(const mode of ['transit','drive']){
        const section=document.createElement('section');
        section.id=mode+'-info';section.className='travel-section';section.tabIndex=-1;
        section.setAttribute('aria-label',mode==='drive'?'開車與停車':'捷運與公車');
        section.append(document.querySelector('#'+venueKey+'-'+mode).content.cloneNode(true));
        content.append(section);
      }
      document.querySelector('#change-venue').textContent=tangcheng?'查看晚宴｜彭園交通 →':'查看儀式｜三重會館交通 →';
      panel.hidden=false;
      if(!tangcheng)updateParking();
      if(scroll)window.scrollTo({top:0,behavior:'auto'});
    }
    function resetVenue(){selectedVenue='';document.body.classList.remove('venue-selected');panel.hidden=true;venueStep.hidden=false;venuePicker.hidden=false;document.querySelectorAll('[data-venue]').forEach(item=>item.setAttribute('aria-pressed','false'));const url=new URL(location.href);url.searchParams.delete('venue');url.searchParams.delete('mode');history.replaceState(null,'',url);venuePicker.scrollIntoView({behavior:'smooth',block:'center'});}
    function updateUrl(venueKey){const url=new URL(location.href);url.searchParams.set('venue',venueKey);url.searchParams.delete('mode');url.hash='';history.replaceState(null,'',url);}
    document.querySelectorAll('[data-venue]').forEach(button=>button.addEventListener('click',()=>{selectVenue(button.dataset.venue);updateUrl(button.dataset.venue);}));
    document.querySelector('#change-venue').addEventListener('click',()=>{const venue=selectedVenue==='tangcheng'?'pengyuan':'tangcheng';selectVenue(venue);updateUrl(venue);});
    function setAvailability(card,value,message){const badge=card.querySelector('.availability');badge.className='availability';if(message){badge.textContent=message;badge.classList.add('error');return}if(value<=0){badge.textContent='目前已滿';badge.classList.add('full')}else{badge.innerHTML=`尚有 <strong>${value}</strong> 格`;badge.classList.add(value<=20?'busy':'good')}}
    const STALE_AFTER_MS=15*60*1000;
    let lastParkingCache=null;
    function renderParking(cache,updatedLabel){
      const stamp=new Date(cache.updatedAt).getTime();
      const stale=!Number.isFinite(stamp)||Date.now()-stamp>STALE_AFTER_MS||stamp>Date.now()+60000;
      content.querySelectorAll('[data-live-parking]').forEach(card=>{
        const raw=cache.parks?.[LIVE_PARKS[card.dataset.liveParking]];
        if(stale){setAvailability(card,null,'資料較舊，請查官方資訊');return;}
        if(raw===null||raw===undefined||String(raw).trim()===''||!Number.isInteger(Number(raw))||Number(raw)<0){
          setAvailability(card,null,'未提供即時車位');return;
        }
        setAvailability(card,Number(raw));
      });
      const time=Number.isFinite(stamp)?new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(stamp)):'時間不明';
      updatedLabel.textContent='車位資料時間：'+time+(stale?'｜資料較舊，請查看官方停車資訊。':'｜頁面每分鐘檢查更新，來源資料可能延遲。');
    }
    async function updateParking(){
      const refreshButton=content.querySelector('#refresh-parking'),updatedLabel=content.querySelector('#last-updated');
      if(!refreshButton||refreshButton.disabled)return;
      refreshButton.disabled=true;refreshButton.textContent='更新中⋯';
      try{
        const response=await fetch(PARKING_CACHE_API+'?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(12000)});
        if(!response.ok)throw new Error('HTTP '+response.status);
        const cache=await response.json();
        if(cache.error||!cache.parks)throw new Error('Parking data unavailable');
        if(!updatedLabel.isConnected)return;
        lastParkingCache=cache;
        renderParking(cache,updatedLabel);
      }catch(error){
        if(!updatedLabel.isConnected)return;
        lastParkingCache=null;
        content.querySelectorAll('[data-live-parking]').forEach(card=>setAvailability(card,null,'暫時無法更新'));
        updatedLabel.textContent='車位更新失敗，請稍後重試或查看官方停車資訊。';
      }finally{refreshButton.disabled=false;refreshButton.textContent='更新車位 ↻';}
    }
    content.addEventListener('click',event=>{if(event.target.closest('#refresh-parking'))updateParking();const toggle=event.target.closest('#toggle-more-parking');if(toggle){const details=content.querySelector('#more-parking');if(details){details.open=!details.open;toggle.setAttribute('aria-expanded',String(details.open));toggle.textContent=details.open?'收起其他選項':'其他停車選項';}}});
    setInterval(()=>{
      if(selectedVenue==='pengyuan'&&!document.hidden){
        const label=content.querySelector('#last-updated');
        if(lastParkingCache&&label)renderParking(lastParkingCache,label);
        updateParking();
      }
    },60000);
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden&&selectedVenue==='pengyuan'){
        const label=content.querySelector('#last-updated');
        if(lastParkingCache&&label)renderParking(lastParkingCache,label);
        updateParking();
      }
    });
    const initialVenue=new URLSearchParams(location.search).get('venue');
    if(VENUES[initialVenue])selectVenue(initialVenue,{scroll:false});
  </script>
</body>
</html>
