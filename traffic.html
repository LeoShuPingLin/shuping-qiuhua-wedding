<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="書平與秋華婚禮交通、停車與即時剩餘車位資訊" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#9a705c" />
  <title>婚禮交通資訊｜書平＆秋華</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#44342e; --muted:#76655d; --accent:#a76a70; --accent-dark:#784a4f; --paper:#fffaf4; --line:rgba(91,67,56,.15); --shadow:0 18px 55px rgba(78,55,44,.11); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 8% 3%,rgba(229,196,181,.3),transparent 26rem),linear-gradient(180deg,#fdf9f4,#f5ece2); font-family:"Noto Sans TC",system-ui,sans-serif; line-height:1.75; }
    a { color:inherit; text-decoration:none; }
    button { color:inherit; font:inherit; }
    [hidden] { display:none !important; }
    .topbar { position:sticky; z-index:20; top:0; min-height:58px; padding:10px max(18px,env(safe-area-inset-left)); display:flex; align-items:center; justify-content:space-between; background:rgba(255,250,244,.9); border-bottom:1px solid var(--line); backdrop-filter:blur(16px); }
    .brand { font-family:"Noto Serif TC",serif; font-weight:700; letter-spacing:.08em; }
    .brand span { color:var(--accent); }
    .back-link { color:var(--muted); font-size:.85rem; font-weight:600; }
    .hero { width:min(920px,calc(100% - 36px)); margin:0 auto; padding:clamp(54px,9vw,92px) 0 34px; text-align:center; }
    .script { margin:0 0 4px; color:var(--accent); font:italic 600 clamp(2.3rem,7vw,4.2rem)/1 "Cormorant Garamond",serif; }
    h1,h2,h3 { font-family:"Noto Serif TC",serif; }
    h1 { margin:10px 0 14px; font-size:clamp(2.15rem,7vw,4rem); letter-spacing:.08em; }
    .hero-note { margin:0 auto; max-width:600px; color:var(--muted); }
    body.venue-selected .hero { padding:30px 0 16px; }
    body.venue-selected .hero .script, body.venue-selected .hero .hero-note { display:none; }
    body.venue-selected .hero h1 { margin:0; font-size:clamp(1.55rem,5vw,2.25rem); }
    main { width:min(920px,calc(100% - 36px)); margin:0 auto 80px; }
    .step-label { margin:0 0 12px; color:var(--accent-dark); font-size:.78rem; font-weight:700; letter-spacing:.16em; }
    .venue-buttons { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
    .venue-button { min-height:156px; padding:24px; border:1px solid rgba(103,76,64,.16); border-radius:24px; background:rgba(255,250,244,.94); box-shadow:var(--shadow); cursor:pointer; text-align:left; transition:transform .2s ease,border-color .2s ease,background .2s ease; }
    .venue-button:hover { transform:translateY(-3px); }
    .venue-button[aria-pressed="true"] { color:#fff; background:#8e6654; border-color:#8e6654; }
    .venue-button small { display:block; margin-bottom:8px; color:var(--accent); font-size:.75rem; font-weight:700; letter-spacing:.15em; }
    .venue-button[aria-pressed="true"] small { color:#f4d6c4; }
    .venue-button strong { display:block; font-family:"Noto Serif TC",serif; font-size:clamp(1.45rem,4vw,2rem); }
    .venue-button span { display:block; margin-top:6px; font-size:.9rem; opacity:.82; }
    .transport-panel { margin-top:28px; padding:clamp(22px,4vw,38px); background:rgba(255,250,244,.94); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow); }
    .venue-summary { display:flex; justify-content:space-between; gap:20px; align-items:end; padding-bottom:22px; border-bottom:1px solid var(--line); }
    .venue-summary .kicker { margin:0 0 4px; color:var(--accent); font-size:.72rem; font-weight:700; letter-spacing:.18em; }
    .venue-summary h2 { margin:0; font-size:clamp(1.55rem,5vw,2.35rem); }
    .venue-summary p { margin:4px 0 0; color:var(--muted); }
    .address { max-width:340px; text-align:right; font-size:.92rem; }
    .mode-buttons { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:22px 0 0; }
    .mode-button { min-height:58px; padding:10px 18px; border:1px solid var(--accent); border-radius:16px; background:transparent; color:var(--accent-dark); cursor:pointer; font-weight:700; }
    .mode-button[aria-pressed="true"] { color:#fff; background:var(--accent-dark); }
    .mode-content { padding-top:26px; }
    .content-heading { margin:0 0 14px; font-size:1.35rem; }
    .empty-prompt { margin:24px 0 0; color:var(--muted); text-align:center; }
    .info-list { margin:0; }
    .info-row { display:grid; grid-template-columns:42px 1fr; gap:12px; padding:16px 0; border-top:1px solid var(--line); }
    .info-row:first-child { border-top:0; padding-top:0; }
    .info-row dt { font-size:1.2rem; text-align:center; }
    .info-row dd { margin:0; color:var(--muted); }
    .info-row strong { display:block; color:var(--ink); }
    .primary-button,.outline-button { min-height:46px; padding:9px 20px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--accent); border-radius:999px; font-weight:700; }
    .primary-button { margin-top:18px; color:#fff; background:var(--accent-dark); border-color:var(--accent-dark); }
    #venue-nav { width:100%; min-height:58px; font-size:1.05rem; }
    .change-venue { width:100%; margin-top:28px; padding:12px 18px; color:var(--muted); background:transparent; border:0; text-decoration:underline; text-underline-offset:5px; cursor:pointer; }
    .parking-heading { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:14px; }
    .parking-heading h3 { margin:0; font-size:1.35rem; }
    .parking-heading p { margin:2px 0 0; color:var(--muted); font-size:.82rem; }
    .refresh-button { flex:0 0 auto; padding:7px 13px; color:var(--accent-dark); background:transparent; border:1px solid var(--accent); border-radius:999px; cursor:pointer; font-weight:700; }
    .parking-list { display:grid; gap:12px; }
    .parking-card { padding:18px 20px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px 18px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:16px; }
    .parking-card h3 { margin:0 0 2px; font-size:1.08rem; }
    .parking-meta,.parking-note { margin:0; color:var(--muted); font-size:.86rem; }
    .parking-note { margin-top:4px; }
    .parking-actions { display:flex; align-items:center; gap:8px; }
    .parking-actions .outline-button { min-height:38px; padding:6px 13px; font-size:.82rem; }
    .availability { min-width:94px; padding:7px 10px; display:inline-flex; justify-content:center; align-items:baseline; gap:3px; border-radius:999px; color:#645b56; background:#eee8e2; font-size:.75rem; font-weight:700; white-space:nowrap; }
    .availability strong { font-size:1.05rem; }
    .availability.good { color:#2f6d50; background:#e2f1e8; }
    .availability.busy { color:#8a5b13; background:#f7ebcc; }
    .availability.full { color:#923f42; background:#f5dddd; }
    .availability.error { color:#6d635d; background:#ece7e2; }
    .live-footer { margin-top:12px; display:flex; justify-content:space-between; gap:14px; color:var(--muted); font-size:.76rem; }
    .official-link { color:var(--accent-dark); font-weight:700; }
    .tip { margin-top:20px; padding:16px 18px; background:rgba(231,216,196,.52); border-radius:14px; color:var(--muted); font-size:.88rem; }
    footer { padding:42px 20px calc(44px + env(safe-area-inset-bottom)); color:#fff; text-align:center; background:#846250; }
    footer p { margin:2px; }
    footer .names { font-family:"Noto Serif TC",serif; font-size:1.4rem; letter-spacing:.1em; }
    @media (max-width:650px) { .hero{padding-top:44px}.venue-buttons{grid-template-columns:1fr;gap:12px}.venue-button{min-height:120px;border-radius:19px}.transport-panel{padding:21px 17px;border-radius:19px}.venue-summary{display:block}.address{margin-top:10px;max-width:none;text-align:left}.parking-card{grid-template-columns:1fr}.parking-actions{justify-content:space-between}.live-footer{flex-direction:column;gap:3px} }
    @media (max-width:390px) { main,.hero{width:min(100% - 24px,920px)}.topbar{padding-inline:13px}.back-link{font-size:.78rem}.info-row{grid-template-columns:32px 1fr;gap:8px}.parking-actions{align-items:stretch;flex-direction:column} }
    @media (prefers-reduced-motion:reduce) { html{scroll-behavior:auto}*{transition-duration:.01ms!important} }
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">書平 <span>♡</span> 秋華</a><a class="back-link" href="index.html">返回婚禮喜帖</a></header>
  <section class="hero"><p class="script">Getting There</p><h1>停車・交通資訊</h1><p class="hero-note">先選擇要前往的場地，再查看適合您的交通方式。</p></section>
  <main>
    <p class="step-label" id="venue-step">STEP 1　選擇場地</p>
    <section class="venue-buttons" id="venue-picker" aria-label="選擇婚禮場地">
      <button class="venue-button" type="button" data-venue="tangcheng" aria-pressed="false"><small>佛前結婚儀式</small><strong>湯城園區</strong><span>13:30 入場｜14:00 開始</span></button>
      <button class="venue-button" type="button" data-venue="pengyuan" aria-pressed="false"><small>幸福晚宴</small><strong>彭園三重館</strong><span>17:30 入席｜18:00 開始</span></button>
    </section>
    <section class="transport-panel" id="transport-panel" aria-live="polite" hidden>
      <div class="venue-summary"><div><p class="kicker" id="venue-kicker"></p><h2 id="venue-title"></h2><p id="venue-time"></p></div><p class="address" id="venue-address"></p></div>
      <a class="primary-button" id="venue-nav" target="_blank" rel="noopener">開啟導航 ↗</a>
      <div class="mode-content" id="mode-content"></div>
      <button class="change-venue" id="change-venue" type="button">查看另一個場地的交通資訊</button>
    </section>
  </main>

  <template id="tangcheng-transit"><h3 class="content-heading">大眾運輸</h3><dl class="info-list"><div class="info-row"><dt>🚇</dt><dd><strong>搭乘捷運</strong>先嗇宮站 1 號出口，出站右轉，步行約 5 分鐘抵達湯城園區。</dd></div><div class="info-row"><dt>🚌</dt><dd><strong>搭乘公車</strong>636、801、857 等路線，於「中興街口」站下車。</dd></div></dl></template>
  <template id="pengyuan-transit"><h3 class="content-heading">大眾運輸</h3><dl class="info-list"><div class="info-row"><dt>🚇</dt><dd><strong>搭乘捷運</strong>三重國小站，出站右轉，步行約 3 分鐘抵達介壽廣場。</dd></div><div class="info-row"><dt>🚌</dt><dd><strong>搭乘公車</strong>857、39、62、忠孝幹線等路線，於「龍門路口」或「介壽廣場」站下車。</dd></div></dl></template>
  <template id="tangcheng-drive">
    <div class="parking-heading"><div><h3>🚗 開車前往</h3><p>湯城園區內設有停車場，可直接駛入停車。</p></div></div>
    <aside class="tip">抵達園區後，請依現場指示前往停車區；車位與費率以現場公告為準。</aside>
  </template>
  <template id="pengyuan-drive">
    <div class="parking-heading"><div><h3>彭園附近停車場</h3><p>公有停車場即時資料約每 5 分鐘同步，實際車位以現場為準。</p></div><button class="refresh-button" id="refresh-parking" type="button">重新整理 ↻</button></div>
    <div class="parking-list">
      <article class="parking-card"><div><h3>台灣聯通介壽場</h3><p class="parking-meta">正義北路319號旁車道進入・約 80 元／小時</p><p class="parking-note">彭園婚宴賓客可能享 3 小時免費，請依當日館方公告。</p></div><div class="parking-actions"><span class="availability error">無即時資料</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E5%8F%B0%E7%81%A3%E8%81%AF%E9%80%9A%E4%BB%8B%E5%A3%BD%E5%81%9C%E8%BB%8A%E5%A0%B4">導航 ↗</a></div></article>
      <article class="parking-card"><div><h3>華南銀行地下停車場</h3><p class="parking-meta">龍門路1號・彭園對面</p><p class="parking-note">機械式停車場，費率與車型限制請依現場公告。</p></div><div class="parking-actions"><span class="availability error">無即時資料</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%96%B0%E5%8C%97%E5%B8%82%E4%B8%89%E9%87%8D%E5%8D%80%E9%BE%8D%E9%96%80%E8%B7%AF1%E8%99%9F">導航 ↗</a></div></article>
      <article class="parking-card" data-live-parking="正義公園地下停車場"><div><h3>正義公園地下停車場</h3><p class="parking-meta">雙園街1號・步行約 6 分鐘</p><p class="parking-note">平日 30 元／小時、國定例假日 40 元／小時。</p></div><div class="parking-actions"><span class="availability">查詢中⋯</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%AD%A3%E7%BE%A9%E5%85%AC%E5%9C%92%E5%9C%B0%E4%B8%8B%E5%81%9C%E8%BB%8A%E5%A0%B4">導航 ↗</a></div></article>
      <article class="parking-card"><div><h3>三張公園地下停車場</h3><p class="parking-meta">大智街188號・步行約 9 分鐘</p><p class="parking-note">約 30 元／小時。</p></div><div class="parking-actions"><span class="availability error">暫無即時資料</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E4%B8%89%E5%BC%B5%E5%85%AC%E5%9C%92%E5%9C%B0%E4%B8%8B%E5%81%9C%E8%BB%8A%E5%A0%B4">導航 ↗</a></div></article>
      <article class="parking-card" data-live-parking="龍門公園地下停車場"><div><h3>龍門公園地下停車場</h3><p class="parking-meta">公園街32號・步行約 9 分鐘</p><p class="parking-note">20 元／小時・機械式車位限高約 150 公分。</p></div><div class="parking-actions"><span class="availability">查詢中⋯</span><a class="outline-button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=%E9%BE%8D%E9%96%80%E5%85%AC%E5%9C%92%E5%9C%B0%E4%B8%8B%E5%81%9C%E8%BB%8A%E5%A0%B4">導航 ↗</a></div></article>
    </div><div class="live-footer"><span id="last-updated">正在連線新北市停車資料⋯</span><a class="official-link" href="https://www.parkinginfo.ntpc.gov.tw/" target="_blank" rel="noopener">查看官方停車資訊 ↗</a></div><aside class="tip">💡 2026.10.9 為國慶日補假，費率可能依國定假日計算；請以現場公告為準。</aside>
  </template>
  <footer><p class="names">書平 ♡ 秋華</p><p>2026.10.9　我們在婚禮現場等你 🤍</p></footer>
  <script>
    const VENUES={tangcheng:{kicker:'CEREMONY · 佛前結婚儀式',title:'創價學會三重會館',time:'2026.10.9　13:30 入場｜14:00 開始',address:'📍 湯城園區 3樓之1｜新北市三重區重新路五段609巷2號',nav:'https://www.google.com/maps/search/?api=1&query=%E6%96%B0%E5%8C%97%E5%B8%82%E4%B8%89%E9%87%8D%E5%8D%80%E9%87%8D%E6%96%B0%E8%B7%AF%E4%BA%94%E6%AE%B5609%E5%B7%B72%E8%99%9F'},pengyuan:{kicker:'RECEPTION · 幸福晚宴',title:'彭園三重館｜國際宴會 B 廳',time:'2026.10.9　17:30 入席｜18:00 開始',address:'📍 介壽廣場 4樓｜新北市三重區龍門路6號',nav:'https://www.google.com/maps/search/?api=1&query=%E5%BD%AD%E5%9C%92%E4%B8%89%E9%87%8D%E9%A4%A8'}};
    const PARKING_CACHE_API='https://api.github.com/repos/LeoShuPingLin/shuping-qiuhua-wedding/issues/1';
    const LIVE_PARKS={'正義公園地下停車場':'020005','龍門公園地下停車場':'020016'};
    const panel=document.querySelector('#transport-panel'),content=document.querySelector('#mode-content'),venueStep=document.querySelector('#venue-step'),venuePicker=document.querySelector('#venue-picker'); let selectedVenue='';
    function selectVenue(venueKey,{scroll=true}={}){if(!VENUES[venueKey])return;selectedVenue=venueKey;document.body.classList.add('venue-selected');venueStep.hidden=true;venuePicker.hidden=true;document.querySelectorAll('[data-venue]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.venue===venueKey)));const venue=VENUES[selectedVenue];document.querySelector('#venue-kicker').textContent=venue.kicker;document.querySelector('#venue-title').textContent=venue.title;document.querySelector('#venue-time').textContent=venue.time;document.querySelector('#venue-address').textContent=venue.address;document.querySelector('#venue-nav').href=venue.nav;content.replaceChildren(document.querySelector(`#${venueKey}-transit`).content.cloneNode(true),document.querySelector(`#${venueKey}-drive`).content.cloneNode(true));panel.hidden=false;if(venueKey==='pengyuan')updateParking();if(scroll)panel.scrollIntoView({behavior:'smooth',block:'start'});}
    function resetVenue(){selectedVenue='';document.body.classList.remove('venue-selected');panel.hidden=true;venueStep.hidden=false;venuePicker.hidden=false;document.querySelectorAll('[data-venue]').forEach(item=>item.setAttribute('aria-pressed','false'));const url=new URL(location.href);url.searchParams.delete('venue');url.searchParams.delete('mode');history.replaceState(null,'',url);venuePicker.scrollIntoView({behavior:'smooth',block:'center'});}
    function updateUrl(venueKey){const url=new URL(location.href);url.searchParams.set('venue',venueKey);url.searchParams.delete('mode');history.replaceState(null,'',url);}
    document.querySelectorAll('[data-venue]').forEach(button=>button.addEventListener('click',()=>{selectVenue(button.dataset.venue);updateUrl(button.dataset.venue);}));
    document.querySelector('#change-venue').addEventListener('click',resetVenue);
    function setAvailability(card,value,message){const badge=card.querySelector('.availability');badge.className='availability';if(message){badge.textContent=message;badge.classList.add('error');return}if(value<=0){badge.textContent='目前已滿';badge.classList.add('full')}else{badge.innerHTML=`尚有 <strong>${value}</strong> 格`;badge.classList.add(value<=20?'busy':'good')}}
    async function updateParking(){const refreshButton=content.querySelector('#refresh-parking'),updatedLabel=content.querySelector('#last-updated');if(!refreshButton||refreshButton.disabled)return;refreshButton.disabled=true;refreshButton.textContent='更新中⋯';try{const response=await fetch(`${PARKING_CACHE_API}?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const issue=await response.json(),match=issue.body&&issue.body.match(/```json\s*([\s\S]*?)```/i);if(!match)throw new Error('Parking cache is missing');const cache=JSON.parse(match[1]);content.querySelectorAll('[data-live-parking]').forEach(card=>{const value=Number(cache.parks&&cache.parks[LIVE_PARKS[card.dataset.liveParking]]);Number.isNaN(value)||value===-9?setAvailability(card,null,'暫無即時資料'):setAvailability(card,value)});updatedLabel.textContent=`資料更新：${new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(cache.updatedAt))}（約每 5 分鐘同步）`}catch(error){content.querySelectorAll('[data-live-parking]').forEach(card=>setAvailability(card,null,'暫時無法連線'));updatedLabel.textContent='即時資料暫時無法連線，可查看官方停車資訊。'}finally{refreshButton.disabled=false;refreshButton.textContent='重新整理 ↻'}}
    content.addEventListener('click',event=>{if(event.target.closest('#refresh-parking'))updateParking()});setInterval(()=>{if(selectedVenue==='pengyuan'&&!content.hidden&&content.querySelector('#refresh-parking'))updateParking()},180000);
    const initialVenue=new URLSearchParams(location.search).get('venue');
    if(VENUES[initialVenue])selectVenue(initialVenue,{scroll:false});
  </script>
</body>
</html>
